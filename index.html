<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>OnlyChat</title>
    <style>
        body { font-family: Arial; background: #121212; color: white; text-align: center; padding: 20px; }
        #app { max-width: 600px; margin: auto; }
        #mensajes { background: #1a1a1a; height: 400px; overflow-y: scroll; border-radius: 10px; padding: 10px; text-align: left; }
        .mensaje { margin-bottom: 10px; }
        .mensaje strong { color: #00aaff; }
        input, button { padding: 10px; border-radius: 5px; border: none; }
        #chatInput { display: flex; gap: 10px; margin-top: 10px; }
        #textoMensaje { flex-grow: 1; }
        button { background: #00aaff; color: white; cursor: pointer; }
    </style>
</head>
<body>
    <div id="app">
        <div id="auth">
            <h1>OnlyChat</h1>
            <input type="email" id="email" placeholder="Correo">
            <input type="password" id="password" placeholder="Contraseña">
            <button onclick="registrar()">Registrar</button>
            <button onclick="login()">Ingresar</button>
        </div>

        <div id="chat" style="display:none;">
            <p>Logeado como: <span id="userEmail"></span> <button onclick="logout()">Salir</button></p>
            <div id="mensajes"></div>
            <div id="chatInput">
                <input type="text" id="textoMensaje" placeholder="Escribe un mensaje" onekeydown="if(event.key==='Enter'){enviarMensaje()}">
                <button onclick="enviarMensaje()">Enviar</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyALTX2f3zGarr7QnXxknZlMzDgOcswSgLs",
  authDomain: "onlychat-7e979.firebaseapp.com",
  databaseURL: "https://onlychat-7e979-default-rtdb.firebaseio.com",
  projectId: "onlychat-7e979",
  storageBucket: "onlychat-7e979.firebasestorage.app",
  messagingSenderId: "728640682270",
  appId: "1:728640682270:web:4a962529e75a103c64b10f"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        let usuarioActual = null;

        const authDiv = document.getElementById('auth');
        const chatDiv = document.getElementById('chat');

        onAuthStateChanged(auth, (user) => {
            if (user) {
                usuarioActual = user;
                document.getElementById('userEmail').innerText = user.email;
                authDiv.style.display = 'none';
                chatDiv.style.display = 'block';
                cargarMensajes();
            } else {
                usuarioActual = null;
                authDiv.style.display = 'block';
                chatDiv.style.display = 'none';
            }
        });

        window.registrar = () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            createUserWithEmailAndPassword(auth, email, password);
        }
        window.login = () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            signInWithEmailAndPassword(auth, email, password);
        }
        window.logout = () => signOut(auth);

        function cargarMensajes() {
            const q = query(collection(db, "mensajes"), orderBy("fecha"));
            onSnapshot(q, (snapshot) => {
                const mensajesDiv = document.getElementById('mensajes');
                mensajesDiv.innerHTML = "";
                snapshot.forEach((doc) => {
                    const msg = doc.data();
                    mensajesDiv.innerHTML += `<div class="mensaje"><strong>${msg.email}:</strong> ${msg.texto}</div>`;
                });
                mensajesDiv.scrollTop = mensajesDiv.scrollHeight;
            });
        }

        window.enviarMensaje = function() {
            const input = document.getElementById('textoMensaje');
            const texto = input.value.trim();
            if(texto === "") return;
            input.value = "";
            input.focus();
            addDoc(collection(db, "mensajes"), {
              texto: texto,
              email: usuarioActual.email,
              fecha: serverTimestamp()
            });
        }
    </script>
</body>
</html>
