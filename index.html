<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OnlyChat</title>
  <style>
    body { font-family: Arial; background: #111; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .container { background: #222; padding: 30px; border-radius: 10px; width: 300px; text-align: center; }
    input { width: 90%; padding: 10px; margin: 10px 0; border: none; border-radius: 5px; }
    .btn { width: 100%; padding: 10px; margin: 5px 0; background: #00aaff; color: white; border: none; border-radius: 5px; cursor: pointer; }
    .btn:hover { background: #0088cc; }
    .oculto { display: none; }
  </style>
</head>
<body>

<div class="container" id="loginContainer">
  <h2>OnlyChat</h2>
  <input type="email" id="email" placeholder="Correo">
  <input type="password" id="password" placeholder="Contraseña">
  <button class="btn" id="btnLogin">Iniciar Sesión</button>
  <button class="btn" id="btnRegistrar">Registrarse</button>
  <p id="mensaje"></p>
</div>

<div class="container oculto" id="appContainer">
  <h2>Bienvenido a OnlyChat</h2>
  <p id="userEmail"></p>
  <button class="btn" id="btnLogout">Cerrar Sesión</button>
</div>

<script type="module">
  // 1. IMPORTAR FIREBASE
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  // 2. TU CONFIGURACION DE FIREBASE - CAMBIALA POR LA TUYA
  const firebaseConfig = {
  apiKey: "AIzaSyALTX2f3zGarr7QnXxknZlMzDgOcswSgLs",
  authDomain: "onlychat-7e979.firebaseapp.com",
  databaseURL: "https://onlychat-7e979-default-rtdb.firebaseio.com",
  projectId: "onlychat-7e979",
  storageBucket: "onlychat-7e979.firebasestorage.app",
  messagingSenderId: "728640682270",
  appId: "1:728640682270:web:4a962529e75a103c64b10f"
  };

  // 3. INICIALIZAR
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // 4. OBTENER ELEMENTOS
  const loginContainer = document.getElementById('loginContainer');
  const appContainer = document.getElementById('appContainer');
  const mensaje = document.getElementById('mensaje');
  const userEmail = document.getElementById('userEmail');

  // 5. FUNCIONES
  async function registrar() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    try {
      const userCredential = await createUserWithEmailAndPassword(auth, email, password);
      await setDoc(doc(db, "usuarios", userCredential.user.uid), {
        email: email,
        premium: false
      });
      mensaje.innerText = "Registrado con éxito";
    } catch (error) {
      mensaje.innerText = error.message;
    }
  }

  async function login() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    try {
      await signInWithEmailAndPassword(auth, email, password);
      mensaje.innerText = "Login exitoso";
    } catch (error) {
      mensaje.innerText = error.message;
    }
  }

  async function logout() {
    await signOut(auth);
  }

  // 6. VER SI EL USUARIO ESTA LOGEADO
  onAuthStateChanged(auth, (user) => {
    if (user) {
      loginContainer.classList.add('oculto');
      appContainer.classList.remove('oculto');
      userEmail.innerText = "Logeado como: " + user.email;
    } else {
      loginContainer.classList.remove('oculto');
      appContainer.classList.add('oculto');
    }
  });

  // 7. CONECTAR BOTONES
  document.getElementById('btnLogin').addEventListener('click', login);
  document.getElementById('btnRegistrar').addEventListener('click', registrar);
  document.getElementById('btnLogout').addEventListener('click', logout);

</script>
</body>
</html>
