<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ONLY CHAT 3.0 PREMIUM</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
  body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); height: 100vh; display: flex; justify-content: center; align-items: center; }
  .login-box, .chat-box { background: white; border-radius: 20px; padding: 30px; width: 90%; max-width: 400px; box-shadow: 0 10px 40px rgba(0,0,0,0.3); }
  h1 { text-align: center; color: #667eea; margin-bottom: 10px; }
  .premium-btn { background: linear-gradient(90deg, #667eea, #764ba2, #ff6b6b); color: white; border: none; padding: 12px; width: 100%; border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 15px; }
  .premium-btn:hover { transform: scale(1.02); }
  input { width: 100%; padding: 12px; margin: 8px 0; border: 2px solid #ddd; border-radius: 10px; }
  .btn { background: #667eea; color: white; border: none; padding: 12px; width: 100%; border-radius: 10px; font-weight: bold; cursor: pointer; }
</style>
</head>
<body>

<div class="login-box" id="loginBox">
  <h1>ONLY CHAT 3.0</h1>
  <p style="text-align:center; color:gray; margin-bottom:20px;">Inicia sesión</p>
  <input type="email" id="email" placeholder="Tu correo">
  <input type="password" id="pass" placeholder="Contraseña">
  <button class="btn" onclick="login()">Entrar</button>
  <button class="premium-btn" onclick="alert('Próximamente: WebPay $3.990/mes')">👑 Hacerse PREMIUM $3.990</button>
</div>

<div class="chat-box" id="chatBox" style="display:none;">
  <h1>Bienvenido!</h1>
  <p>Aquí irá el chat 3.0</p>
</div>

<script>
function login(){
  const email = document.getElementById('email').value;
  if(email.includes('@')){
    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('chatBox').style.display = 'block';
    localStorage.setItem('user', email);
  } else {
    alert('Pon un correo válido prota')
  }
}
</script>

</body>
</html>
