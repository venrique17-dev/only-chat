<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>ONLY CHAT</title>
<style>
body { font-family: Arial; background: #667eea; display:flex; justify-content:center; align-items:center; height: 100vh; margin:0; }
.chat { width: 90%; max-width: 500px; height: 90vh; background: white; border-radius: 15px; display: flex; flex-direction: column; }
.header { background: #667eea; color: white; padding: 15px; font-weight: bold; text-align: center; border-radius: 15px 15px 0 0; }
.mensajes { flex: 1; overflow-y: auto; padding: 15px; background: #f8f9fa; }
.msg { margin: 8px 0; padding: 10px; background: #e6f2ff; border-radius: 12px; }
.input { display: flex; padding: 15px; border-top: 1px solid #ddd; }
.input input { flex: 1; padding: 10px; border: 2px solid #ddd; border-radius: 20px; }
.input button { margin-left: 10px; padding: 10px 20px; background: #667eea; color: white; border: none; border-radius: 20px; cursor: pointer; }
</style>
</head>
<body>
<div class="chat">
  <div class="header">ONLY CHAT - EN LINEA 💬</div>
  <div class="mensajes" id="mensajes"></div>
  <div class="input">
    <input type="text" id="inputMensaje" placeholder="Escribe un mensaje...">
    <button id="btnEnviar">Enviar</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyALTX2f3zGarr7QnXxknZlMzDgOcswSgLs",
    authDomain: "onlychat-7e979.firebaseapp.com",
    databaseURL: "https://onlychat-7e979-default-rtdb.firebaseio.com",
    projectId: "onlychat-7e979",
    storageBucket: "onlychat-7e979.firebasestorage.app",
    messagingSenderId: "728640682270",
    appId: "1:728640682270:web:4a962529e75a103c64b10f"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const mensajesRef = ref(db, 'mensajes');

  const input = document.getElementById('inputMensaje');
  const btn = document.getElementById('btnEnviar');
  const divMensajes = document.getElementById('mensajes');

  function enviarMensaje() {
    const texto = input.value;
    if(texto.trim() !== ''){
      push(mensajesRef, { usuario: "Prota", texto: texto, hora: new Date().toLocaleTimeString('es-CL', {hour: '2-digit', minute:'2-digit'}) });
      input.value = '';
    }
  }
  btn.onclick = enviarMensaje;
  input.addEventListener("keypress", e => { if(e.key === "Enter") enviarMensaje() });

  onChildAdded(mensajesRef, (data) => {
    const msg = data.val();
    const div = document.createElement('div');
    div.className = 'msg';
    div.innerHTML = `<b>${msg.usuario}</b> <small>${msg.hora}</small><br>${msg.texto}`;
    divMensajes.appendChild(div);
    divMensajes.scrollTop = divMensajes.scrollHeight;
  });
</script>
</body>
</html>
