<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OnlyChat</title>
  <style>
    body { font-family: Arial; background: #111; color: white; margin: 0; }
    .container { background: #222; padding: 20px; border-radius: 10px; width: 350px; margin: 50px auto; text-align: center; }
    input { width: 90%; padding: 10px; margin: 10px 0; border: none; border-radius: 5px; }
    .btn { width: 100%; padding: 10px; margin: 5px 0; background: #00aaff; color: white; border: none; border-radius: 5px; cursor: pointer; }
    .btn:hover { background: #0088cc; }
    .oculto { display: none; }
    
    /* ESTILOS DEL CHAT */
    #chatContainer { width: 90%; max-width: 600px; margin: 20px auto; }
    #mensajes { background: #1a1a1a; height: 400px; overflow-y: scroll; padding: 10px; border-radius: 10px; text-align: left; }
    .mensaje { margin: 8px 0; padding: 8px; background: #333; border-radius: 5px; }
    .mensaje b { color: #00aaff; }
    #chatInput { display: flex; gap: 10px; margin-top: 10px; }
    #chatInput input { flex: 1; }
    #chatInput button { width: 100px; }
    .header { display: flex; justify-content: space-between; align-items: center; }
  </style>
</head>
<body>

<!-- LOGIN -->
<div class="container" id="loginContainer">
  <h2>OnlyChat</h2>
  <input type="email" id="email" placeholder="Correo">
  <input type="password" id="password" placeholder="Contraseña">
  <button class="btn" id="btnLogin">Iniciar Sesión</button>
  <button class="btn" id="btnRegistrar">Registrarse</button>
  <p id="mensaje"></p>
</div>

<!-- CHAT -->
<div class="container oculto" id="chatContainer">
  <div class="header">
    <h2>OnlyChat</h2>
    <button class="btn" id="btnLogout" style="width:120px;">Salir</button>
  </div>
  <p>Logeado como: <span id="userEmail"></span></p>
  
  <div id="mensajes"></div>
  
  <div id="chatInput">
    <input type="text" id="textoMensaje" placeholder="Escribe un mensaje...">
    <button class="btn" id="btnEnviar">Enviar</button>
  </div>
</div>

<script type="module">
  // 1. IMPORTAR FIREBASE
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  // 2. TU CONFIGURACION DE FIREBASE - PEGA LA TUYA AQUI
  const firebaseConfig = {
    apiKey: "AIzaSyALTX2f3zGarr7QnXxknZlMzDgOcswSgLs",
  authDomain: "onlychat-7e979.firebaseapp.com",
  databaseURL: "https://onlychat-7e979-default-rtdb.firebaseio.com",
  projectId: "onlychat-7e979",
  storageBucket: "onlychat-7e979.firebasestorage.app",
  messagingSenderId: "728640682270",
  appId: "1:728640682270:web:4a962529e75a103c64b10f"
  };

  // 3. INICIALIZAR
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // 4. VARIABLES GLOBALES - YA CORREGIDO chatContainer
  let usuarioActual = null;
  const loginContainer = document.getElementById('loginContainer');
  const chatContainer = document.getElementById('chatContainer'); // YA ESTA BIEN
  const mensajesDiv = document.getElementById('mensajes');
  const userEmailSpan = document.getElementById('userEmail');

  // 5. FUNCIONES LOGIN/REGISTRO
  async function registrar() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    try {
      const userCredential = await createUserWithEmailAndPassword(auth, email, password);
      await setDoc(doc(db, "usuarios", userCredential.user.uid), { email: email });
      document.getElementById('mensaje').innerText = "Registrado con éxito";
    } catch (error) { document.getElementById('mensaje').innerText = error.message; }
  }

  async function login() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    try { 
      await signInWithEmailAndPassword(auth, email, password); 
      document.getElementById('mensaje').innerText = "Login exitoso";
    } 
    catch (error) { document.getElementById('mensaje').innerText = error.message; }
  }

  async function logout() { await signOut(auth); }

  // 6. FUNCION ENVIAR MENSAJE
  async function enviarMensaje() {
    const texto = document.getElementById('textoMensaje').value;
    if(texto.trim() === "") return;
    
    await addDoc(collection(db, "mensajes"), {
      texto: texto,
      email: usuarioActual.email,
      fecha: serverTimestamp()
    });
    document.getElementById('textoMensaje').value = "";
  }

  // 7. ESCUCHAR MENSAJES EN TIEMPO REAL
  function cargarMensajes() {
    const q = query(collection(db, "mensajes"), orderBy("fecha"));
    onSnapshot(q, (snapshot) => {
      mensajesDiv.innerHTML = "";
      snapshot.forEach((doc) => {
        const msg = doc.data();
        mensajesDiv.innerHTML += `<div class="mensaje"><b>${msg.email}:</b> ${msg.texto}</div>`;
      });
      mensajesDiv.scrollTop = mensajesDiv.scrollHeight; // bajar scroll
    });
  }

  // 8. VER SI EL USUARIO ESTA LOGEADO - YA CORREGIDO chatContainer
  onAuthStateChanged(auth, (user) => {
    if (user) {
      usuarioActual = user;
      loginContainer.classList.add('oculto');
      chatContainer.classList.remove('oculto'); // YA ESTA BIEN
      userEmailSpan.innerText = user.email;
      cargarMensajes(); // empieza a escuchar el chat
    } else {
      usuarioActual = null;
      loginContainer.classList.remove('oculto');
      chatContainer.classList.add('oculto'); // YA ESTA BIEN
    }
  });

  // 9. CONECTAR BOTONES
  document.getElementById('btnLogin').addEventListener('click', login);
  document.getElementById('btnRegistrar').addEventListener('click', registrar);
  document.getElementById('btnLogout').addEventListener('click', logout);
  document.getElementById('btnEnviar').addEventListener('click', enviarMensaje);
  
  // Enviar con Enter
  document.getElementById('textoMensaje').addEventListener('keypress', (e) => {
    if(e.key === 'Enter') enviarMensaje();
  });

</script>
</body>
</html>
